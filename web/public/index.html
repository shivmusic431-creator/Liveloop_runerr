<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1217">
<title>LiveLoop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1217'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff4d3d'/%3E%3C/svg%3E">
<style>
:root{--bg:#0e1217;--panel:#151b23;--raise:#1c242e;--line:#27313d;--tx:#e8edf2;--mu:#8795a5;--amber:#f5a524;--on-amber:#1a1204;--red:#ff4d3d;--teal:#34d1bf;--err:#ff7a70;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f7;--panel:#fff;--raise:#eef1f5;--line:#d9e0e8;--tx:#141a21;--mu:#5d6b7a;--amber:#d98a00;--on-amber:#fff;--red:#e5301f;--teal:#0f9d8d;--err:#c93a2e;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;flex:1}
.pill{font-size:12.5px;color:var(--mu);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.pill.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.tally{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;position:relative}
.tally.live{background:var(--red)}
.tally.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--red);opacity:.0;animation:ring 1.8s ease-out infinite}
.tally.wait{background:var(--amber)}.tally.err{background:var(--err)}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.tally.live::after{animation:none;opacity:.5}}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}.bar h2{flex:1;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
.card.live{border-left:3px solid var(--red);padding-left:12px}
.card.lost,.card.error{border-left:3px solid var(--err);padding-left:12px}
.head{display:flex;align-items:center;gap:10px}.head b{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--raise);color:var(--mu)}
.tag.live{background:var(--red);color:#fff;font-weight:600}.tag.wait{color:var(--amber)}.tag.err{color:var(--err)}
.mu{color:var(--mu);font-size:13.5px}.sm{font-size:13px}
.meta{margin:6px 0 0}
.clock{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:10px 0 2px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mu);font-size:13.5px;margin-bottom:10px}.kv b{color:var(--tx);font-weight:500;font-variant-numeric:tabular-nums}
.msg{font-size:13.5px;margin:8px 0;color:var(--mu)}.msg.e{color:var(--err)}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--mu)}.btn:disabled{opacity:.5;cursor:default}
.btn.p{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:600}
.btn.d{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.g{background:none}.btn.s{padding:6px 10px;min-height:34px;font-size:13.5px}
.btn.full{width:100%}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
label{display:block;font-size:13.5px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:42px}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--amber)}
textarea{resize:vertical}
.hrs{max-width:150px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{font-size:12px;background:var(--raise);border-radius:6px;padding:1px 7px;color:var(--mu);margin-right:4px;display:inline-block}
.prog{height:6px;background:var(--raise);border-radius:9px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--amber);transition:width .4s}
.empty{text-align:center;color:var(--mu);padding:34px 14px}.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:9px 0 8px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;cursor:pointer}
nav button.on{color:var(--amber)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-size:18px;margin-bottom:2px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:55vh;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:10px 0 0}
.ok{color:var(--teal)}.no{color:var(--err)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:92vw;font-size:14px;box-shadow:0 6px 24px #0006}
.toast.e{background:var(--err);color:#fff}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.hid{display:none!important}
.plan{margin:8px 0 2px}.plan .pi{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.plan .pi:last-child{border:0}.plan .pi i{font-style:normal;flex:none;width:18px;text-align:center}.plan .pi div{flex:1;min-width:0;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--mu);font-size:13.5px;margin-top:12px}
</style>
</head>
<body>
<div id="login" class="login hid">
  <div class="logo" style="margin-bottom:18px"><span class="tally live"></span>LiveLoop</div>
  <div class="card">
    <h3 id="lt">पासवर्ड डालो</h3><p id="lm" class="mu" style="margin:4px 0 0"></p>
    <label for="pw">Dashboard password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn p full" style="margin-top:14px" data-a="login">अंदर जाओ</button>
  </div>
  <p class="mu sm" style="text-align:center;margin-top:14px"><a href="#" data-a="debug">🐞 Debug console खोलो</a></p>
</div>

<div id="app" class="wrap hid">
  <div class="top"><div class="logo"><span class="tally" id="mt"></span>LiveLoop</div><span class="pill" id="sp"></span></div>
  <main id="view"></main>
</div>
<nav id="nav" class="hid"><div>
  <button data-a="tab" data-id="lives"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/></svg>लाइव</button>
  <button data-a="tab" data-id="videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>वीडियो</button>
  <button data-a="tab" data-id="channels"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="m8 3 4 4 4-4"/></svg>चैनल</button>
  <button data-a="tab" data-id="clips"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>क्लिप्स</button>
  <button data-a="tab" data-id="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.3 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>सेटअप</button>
</div></nav>
<div id="layer"></div>

<script>
'use strict';
// ---------- Eruda (mobile debug console) ----------
const ERUDA_SRC = 'https://cdn.jsdelivr.net/npm/eruda@3.4.1/eruda.js';
const debugOn = () => { try { return localStorage.getItem('ll_debug') === '1'; } catch { return false; } };
const loadEruda = () => new Promise((ok, no) => {
  if (window.eruda && window.eruda._ll) return ok();
  const s = document.createElement('script'); s.src = ERUDA_SRC;
  s.onload = () => { try { window.eruda.init(); window.eruda._ll = 1; ok(); } catch (e) { no(e); } };
  s.onerror = () => no(new Error('Eruda load nahi hua (internet/CDN check karo)'));
  document.head.appendChild(s);
});
if (debugOn() || /[?&]debug\b/.test(location.search)) loadEruda().catch(e => console.warn(e.message));
window.addEventListener('unhandledrejection', e => console.error('Unhandled:', e.reason));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (u, o = {}) => {
  const r = await fetch(u, { credentials: 'same-origin', signal: AbortSignal.timeout(28000), ...o, headers: { 'x-liveloop': '1', 'Content-Type': 'application/json', ...(o.headers || {}) } });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok && !j.error && r.status >= 500) j.error = 'Server error ' + r.status + '. Vercel → Deployments → Functions logs देखो';
  if (!r.ok) { if (r.status === 401 && u !== '/api/login') boot(); throw new Error(j.error || 'Error ' + r.status); }
  return j;
};
const post = (u, b) => api(u, { method: 'POST', body: JSON.stringify(b || {}) });
const del = u => api(u, { method: 'DELETE' });

// ---------- helpers ----------
const bytes = n => n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + ' MB';
const dur = ms => { const s = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, '0'); return `${p(Math.floor(s / 3600))}:${p(Math.floor(s % 3600 / 60))}:${p(s % 60)}`; };
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'अभी' : m < 60 ? m + ' मिनट पहले' : Math.round(m / 60) + ' घंटे पहले'; };
let toastT; function toast(m, bad) { const old = $('.toast'); if (old) old.remove(); const t = document.createElement('div'); t.className = 'toast' + (bad ? ' e' : ''); t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), bad ? 6000 : 3000); }
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message || String(e), true); } };

// ---------- state ----------
const ST = { tab: 'lives', clips: null, lives: [], accounts: [], videos: null, imports: [], health: null, info: {}, hours: {}, now: Date.now(), skew: 0 };
const LABEL = { idle: 'तैयार', queued: 'कतार में', starting: 'शुरू हो रहा', preparing: 'YouTube तैयार', live: 'LIVE', stopping: 'रुक रहा', stopped: 'बंद', error: 'Error', lost: 'संपर्क टूटा' };
const RUNNING = ['queued', 'starting', 'preparing', 'live', 'stopping'];
const isImg = n => /\.(jpe?g|png)$/i.test(n);

// ---------- boot / login ----------
async function boot() {
  stopPoll();
  const s = await fetch('/api/session').then(r => r.json()).catch(() => ({}));
  if (s.authed) { $('#login').classList.add('hid'); $('#app').classList.remove('hid'); $('#nav').classList.remove('hid'); start(); return; }
  $('#app').classList.add('hid'); $('#nav').classList.add('hid'); $('#login').classList.remove('hid');
  $('#lm').textContent = s.configured === false ? 'Vercel Environment Variables में ADMIN_PASSWORD और FIREBASE_SERVICE_ACCOUNT डालो, फिर Redeploy करो।' : 'अपना dashboard password डालो।';
  $('#pw').focus();
}
const login = guard(async () => { await post('/api/login', { password: $('#pw').value }); $('#pw').value = ''; boot(); });
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ---------- polling ----------
let pt = null, alive = false;
function stopPoll() { alive = false; clearTimeout(pt); }
async function start() {
  const q = new URLSearchParams(location.search);
  if (q.get('ok')) toast(q.get('ok')); if (q.get('err')) toast(q.get('err'), true);
  if (q.has('ok') || q.has('err')) history.replaceState(null, '', '/');
  if (!alive) { alive = true; ST.tab = (location.hash || '#lives').slice(1); if (!['lives', 'videos', 'channels', 'clips', 'setup'].includes(ST.tab)) ST.tab = 'lives'; await poll(); }
}
async function poll() {
  if (!alive) return;
  if (!document.hidden) await refresh().catch(() => { });
  const busy = ST.lives.some(l => RUNNING.includes(l.run.state)) || ST.imports.some(i => !['done', 'error'].includes(i.status)) || !!(ST.clips && ST.clips.active);
  pt = setTimeout(poll, busy ? 3000 : 15000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && alive) { clearTimeout(pt); poll(); } });
async function refresh() {
  const s = await api('/api/state'); ST.skew = s.now - Date.now();
  Object.assign(ST, { lives: s.lives, accounts: s.accounts, info: s });
  const wantImp = ST.tab === 'videos' || ST.imports.some(i => !['done', 'error'].includes(i.status));
  if (wantImp) { const prev = ST.imports; ST.imports = await api('/api/imports'); if (ST.imports.some(i => i.status === 'done' && prev.find(p => p.id === i.id && p.status !== 'done'))) ST.videos = null; }
  if (ST.tab === 'videos' && !ST.videos) await loadVideos();
  if (ST.tab === 'clips' || (ST.clips && ST.clips.active)) { try { ST.clips = await api('/api/clips'); } catch (e) { if (ST.tab === 'clips') throw e; } }
  render();
}
const loadVideos = async () => { try { ST.videos = await api('/api/videos'); } catch (e) { ST.videos = []; toast(e.message, true); } };

// ---------- render ----------
let lastHtml = '';
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === ST.tab));
  const n = ST.lives.filter(l => l.run.state === 'live').length, any = ST.lives.some(l => RUNNING.includes(l.run.state));
  $('#sp').textContent = n ? `${n} LIVE` : any ? 'शुरू हो रहा' : (ST.clips && ST.clips.active) ? 'क्लिप चल रहा' : 'सब बंद'; $('#sp').className = 'pill' + (n ? ' on' : '');
  $('#mt').className = 'tally' + (n ? ' live' : any ? ' wait' : '');
  const html = ({ lives: vLives, videos: vVideos, channels: vChannels, clips: vClips, setup: vSetup })[ST.tab]();
  const v = $('#view');
  if (html !== lastHtml && !(v.contains(document.activeElement) && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) { lastHtml = html; v.innerHTML = html; }
  clock();
}
function clock() {
  const now = Date.now() + ST.skew;
  document.querySelectorAll('[data-since]').forEach(e => { e.textContent = dur(now - +e.dataset.since); });
  document.querySelectorAll('[data-until]').forEach(e => { e.textContent = dur(+e.dataset.until - now); });
}
setInterval(clock, 1000);

function vLives() {
  const L = ST.lives;
  const head = `<div class="bar"><h2>आपके Lives</h2>${L.length ? `<button class="btn s" data-a="stopall">सब बंद</button><button class="btn s p" data-a="startall">सब शुरू</button>` : ''}</div>`;
  if (!L.length) return head + `<div class="empty"><b>अभी कोई live नहीं है</b>पहले Videos टैब में video जोड़ो, फिर यहाँ live बनाओ।<div class="row" style="justify-content:center"><button class="btn p" data-a="edit">+ नया live</button></div></div>`;
  return head + L.map(card).join('') + `<button class="btn full" data-a="edit">+ नया live</button>`;
}
function card(l) {
  const r = l.run, st = r.state, running = RUNNING.includes(st), cls = st === 'live' ? 'live' : st === 'lost' ? 'lost' : st === 'error' ? 'error' : '';
  const ch = l.mode === 'api' ? '📺 ' + esc((ST.accounts.find(a => a.id === l.account) || {}).title || 'channel चुनो') : '🔑 RTMP key ' + (l.hasKey ? '✔' : '✘');
  const tally = st === 'live' ? 'live' : (running || st === 'lost') ? (st === 'lost' ? 'err' : 'wait') : st === 'error' ? 'err' : '';
  const tag = st === 'live' ? 'live' : (running ? 'wait' : (st === 'error' || st === 'lost') ? 'err' : '');
  let body = '';
  if (st === 'live') body += `<div class="clock" data-since="${r.startedAt || Date.now()}">--:--:--</div><div class="kv"><span>चलते हुए</span>${r.stopAt ? `<span>बंद होने में <b data-until="${r.stopAt}">--</b></span>` : ''}<span>speed <b>${r.speed ?? '-'}x</b></span><span>fps <b>${r.fps ?? '-'}</b></span><span>reconnect <b>${r.reconnects}</b></span>${r.ytStatus ? `<span>YouTube <b>${esc(r.ytStatus)}</b></span>` : ''}</div>`;
  if (r.msg && st !== 'live') body += `<div class="msg ${st === 'error' || st === 'lost' ? 'e' : ''}">${esc(r.msg)}</div>`;
  if (st === 'lost') body += `<div class="msg e">Runner से 90 सेकंड से संपर्क नहीं हुआ। GitHub Actions में job देखो, फिर रीसेट करो।</div>`;
  if (st === 'queued' && Date.now() + ST.skew - r.queuedAt > 120000) body += `<div class="msg e">2 मिनट से runner शुरू नहीं हुआ। Secrets या workflow जाँचो: <a href="${esc(ST.info.actionsUrl)}" target="_blank" rel="noopener">GitHub Actions</a></div>`;
  if (st === 'live' && r.err) body += `<div class="msg e">⚠ ${esc(r.err)}</div>`;
  const links = [r.watch ? `<a href="${esc(r.watch)}" target="_blank" rel="noopener">YouTube link</a>` : '', r.runUrl && running ? `<a href="${esc(r.runUrl)}" target="_blank" rel="noopener">Runner logs</a>` : ''].filter(Boolean).join(' · ');
  if (links) body += `<div class="sm" style="margin:4px 0 2px">${links}</div>`;
  let act;
  if (st === 'lost') act = `<div class="row"><button class="btn d grow" data-a="reset" data-id="${l.id}">रीसेट करो</button><button class="btn" data-a="logs" data-id="${l.id}">Logs</button></div>`;
  else if (running) act = `<div class="row"><button class="btn d grow" data-a="stop" data-id="${l.id}" ${r.stopRequested || st === 'stopping' ? 'disabled' : ''}>${r.stopRequested || st === 'stopping' ? 'रुक रहा है…' : '■ बंद करो'}</button><button class="btn" data-a="logs" data-id="${l.id}">Logs</button></div>`;
  else act = `<div class="row"><input class="hrs" id="h-${l.id}" type="number" min="0" max="5.5" step="any" inputmode="decimal" aria-label="Auto-stop घंटे" placeholder="घंटे" value="${esc(ST.hours[l.id] ?? (l.hours || ''))}" data-h="${l.id}"><button class="btn p grow" data-a="go" data-id="${l.id}">▶ Live शुरू करो</button></div>
  <div class="row"><button class="btn s" data-a="edit" data-id="${l.id}">Edit</button><button class="btn s" data-a="dup" data-id="${l.id}">Duplicate</button><button class="btn s" data-a="logs" data-id="${l.id}">Logs</button><button class="btn s g" data-a="rm" data-id="${l.id}">Delete</button></div>`;
  return `<section class="card ${cls}"><div class="head"><span class="tally ${tally}"></span><b>${esc(l.name)}</b><span class="tag ${tag}">${LABEL[st] || esc(st)}</span></div>

  <label for="i-fit">Fit</label><select id="i-fit"><option value="crop">Center crop</option><option value="pad">Black bars</option></select></div>
  <p class="mu sm">Convert सिर्फ़ तब होता है जब video copy-mode के लायक न हो (codec, audio या keyframe gap)। Convert के बाद भी file 2 GB से छोटी होनी चाहिए।</p>
  <div class="row"><button class="btn grow" data-a="close">रद्द करो</button><button class="btn p grow" data-a="doimport">Import शुरू करो</button></div>`);
}
layer.addEventListener('change', e => { if (e.target.dataset.ch === 'conv') $('#i-opt').classList.toggle('hid', e.target.value === 'none'); });

function clipSheet() {
  if (!ST.accounts.length) return toast('पहले Channels टैब में YouTube चैनल जोड़ो', true);
  const o = (v, t, d) => `<option value="${v}" ${d === v ? 'selected' : ''}>${t}</option>`;
  openSheet(`<h3>नया क्लिप जॉब</h3><p class="mu sm" style="margin:2px 0 0">Runner video download करेगा, Gemini best parts निकालेगा, clips बनाकर YouTube पर रोज़ एक के हिसाब से schedule करेगा।</p>
  <label for="c-url">YouTube video link</label><input id="c-url" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off">
  <label for="c-acc">किस चैनल पर schedule हो</label><select id="c-acc">${ST.accounts.map(a => `<option value="${esc(a.id)}">${esc(a.title)}</option>`).join('')}</select>
  <div class="grid2"><div><label for="c-clips">कितने clips (0 = अपने आप)</label><input id="c-clips" type="number" min="0" max="30" value="0" inputmode="numeric"></div><div><label for="c-pd">रोज़ कितने</label><select id="c-pd">${o('1', '1', '1')}${o('2', '2', '1')}${o('3', '3', '1')}</select></div></div>
  <details><summary>और विकल्प</summary>
  <div class="grid2"><div><label for="c-min">Clip कम से कम (सेकंड)</label><input id="c-min" type="number" min="10" max="120" value="25" inputmode="numeric"></div><div><label for="c-max">Clip ज़्यादा से ज़्यादा</label><input id="c-max" type="number" min="15" max="170" value="60" inputmode="numeric"></div></div>
  <div class="grid2"><div><label for="c-or">Frame</label><select id="c-or">${o('blur', 'Blur background (पूरा video दिखे)', 'blur')}${o('crop', 'Center crop (full screen)', 'blur')}</select></div><div><label for="c-cap">Captions</label><select id="c-cap">${o('1', 'जलाओ (burned-in)', '1')}${o('0', 'नहीं', '1')}</select></div></div>
  <div class="grid2"><div><label for="c-bud">Gemini calls की सीमा (5-20)</label><input id="c-bud" type="number" min="5" max="20" value="15" inputmode="numeric"></div><div><label for="c-wh">Whisper (captions न हों तो)</label><select id="c-wh">${o('small', 'small (बेहतर, धीमा)', 'small')}${o('base', 'base (तेज़)', 'small')}</select></div></div>
  <div class="grid2"><div><label for="c-tz">Time zone</label><input id="c-tz" value="Asia/Kolkata"></div><div><label for="c-sd">पहला schedule दिन (खाली = कल)</label><input id="c-sd" type="date"></div></div>
  <div class="grid2"><div><label for="c-lang">भाषा (खाली = अपने आप)</label><select id="c-lang">${o('', 'अपने आप', '')}${o('hi', 'Hindi', '')}${o('en', 'English', '')}</select></div><div><label for="c-mm">Video अधिकतम (मिनट)</label><input id="c-mm" type="number" min="5" max="300" value="240" inputmode="numeric"></div></div></details>
  <p class="mu sm">Clips बनते ही सब एक साथ schedule हो जाते हैं (private + तय समय), और YouTube उसी समय खुद public करेगा। काम पूरा होने पर runner की सारी temporary files हट जाती हैं।</p>
  <div class="row"><button class="btn grow" data-a="close">रद्द करो</button><button class="btn p grow" data-a="cstart">शुरू करो</button></div>`);
}
function keySheet() {
  openSheet(`<h3>Gemini API key जोड़ो</h3><p class="mu sm" style="margin:2px 0 0">एक या कई keys paste करो (हर एक नई line में)। हर key अलग Google project की हो, तभी एक का quota खत्म होने पर दूसरी काम आएगी।</p>
  <label for="k-keys">API keys</label><textarea id="k-keys" rows="4" placeholder="AIza…" autocomplete="off" spellcheck="false"></textarea>
  <div class="row"><button class="btn grow" data-a="close">रद्द करो</button><button class="btn p grow" data-a="ksave">Save करो</button></div>`);
}
function cookieSheet() {
  openSheet(`<h3>YouTube cookies</h3><p class="mu sm" style="margin:2px 0 0">“Get cookies.txt LOCALLY” जैसे extension से youtube.com की cookies.txt export करके यहाँ पूरी paste करो। Cookies encrypted सेव होती हैं।</p>
  <label for="ck-t">cookies.txt की सामग्री</label><textarea id="ck-t" rows="6" placeholder="# Netscape HTTP Cookie File&#10;.youtube.com&#9;TRUE&#9;/&#9;…" autocomplete="off" spellcheck="false"></textarea>
  <div class="row"><button class="btn grow" data-a="close">रद्द करो</button><button class="btn p grow" data-a="cksave">Save करो</button></div>`);
}

let logT = null, logId = '', logKind = 'live';
function logsSheet(id, kind) {
  logId = id; logKind = kind || 'live'; const l = logKind === 'clip' ? { name: 'Clips' } : ST.lives.find(x => x.id === id);
  openSheet(`<h3>Logs: ${esc(l ? l.name : '')}</h3><pre id="lg">लोड हो रहा है…</pre><div class="row"><button class="btn grow" data-a="close">बंद</button><button class="btn grow" data-a="copylog">Copy</button></div>`);
  const pull = async () => { try { const r = await api((logKind === 'clip' ? '/api/cliplogs?id=' : '/api/logs?id=') + encodeURIComponent(id)); const p = $('#lg'); if (!p) return; const bot = p.scrollTop + p.clientHeight >= p.scrollHeight - 30; p.textContent = r.lines.join('\n') || 'अभी कोई log नहीं।'; if (bot) p.scrollTop = p.scrollHeight; } catch { } };
  pull(); clearInterval(logT); logT = setInterval(pull, 3000);
}

// ---------- actions ----------
const A = {
  login,
  tab: id => { ST.tab = id; location.hash = id; lastHtml = ''; if (id === 'videos') { ST.videos = null; refresh().catch(() => { }); } if (id === 'setup' && !ST.health) A.health(); if (id === 'clips') { ST.clips = null; refresh().catch(() => { }); } render(); },
  health: async () => { ST.health = null; lastHtml = ''; render(); try { ST.health = await api('/api/health'); } catch (e) { ST.health = [{ name: 'जाँच नहीं हो पाई', ok: false, msg: e.message }]; } lastHtml = ''; render(); },
  debug: async () => {
    if (debugOn() && window.eruda && window.eruda._ll) { try { localStorage.removeItem('ll_debug'); } catch { } location.reload(); return; }
    try { localStorage.setItem('ll_debug', '1'); } catch { }
    try { await loadEruda(); toast('Debug console चालू। नीचे दाएँ गियर बटन दबाओ'); lastHtml = ''; if (alive) render(); } catch (e) { toast(e.message, true); }
  },
  logout: async () => { await post('/api/logout'); boot(); },
  go: guard(async id => { const h = $('#h-' + id); await post('/api/start', { id, hours: h ? h.value : '' }); delete ST.hours[id]; toast('Start भेज दिया। Runner शुरू होने में 30-60 सेकंड लगते हैं'); await refresh(); }),
  stop: guard(async id => { await post('/api/stop', { id }); toast('बंद करने का signal भेजा'); await refresh(); }),
  reset: guard(async id => { if (await ask('Live रीसेट करें?', 'Runner job cancel होगा और status “बंद” हो जाएगा। चल रहा broadcast YouTube पर अपने आप पूरा किया जाएगा।', 'रीसेट करो', true)) { await post('/api/reset', { id }); await refresh(); } }),
  startall: guard(async () => { const r = await post('/api/startall'); if (r.errors.length) toast(r.errors.join('\n'), true); else toast('सब live शुरू किए'); await refresh(); }),
  stopall: guard(async () => { if (await ask('सब live बंद करें?', 'चल रहे सभी live रुक जाएंगे।', 'सब बंद करो', true)) { await post('/api/stopall'); await refresh(); } }),
  edit: guard(id => editLive(id)), dup: guard(id => editLive(id, true)),
  rm: guard(async id => { const l = ST.lives.find(x => x.id === id); if (await ask('Live delete करें?', `“${l.name}” हट जाएगा। Videos सुरक्षित रहेंगे।`, 'Delete करो', true)) { await del('/api/lives?id=' + id); await refresh(); } }),
  logs: id => logsSheet(id),
  copylog: () => { navigator.clipboard.writeText($('#lg').textContent).then(() => toast('Copy हो गया')); },
  copy: a => navigator.clipboard.writeText(a).then(() => toast('Copy हो गया')),
  close: closeSheet,
  scrim: (_, e) => { if (e.target.classList.contains('scrim')) closeSheet(); },
  yes: () => answer(true), no: () => answer(false),
  savelive: guard(async () => { keepEdit(); const r = readEdit(); if (!r.name.trim()) throw new Error('Live का नाम डालो'); if (!r.videos.length) throw new Error('कम से कम एक video चुनो'); await post('/api/lives', r); closeSheet(); E = null; toast('Save हो गया'); await refresh(); }),
  vadd: n => { const k = keepEdit(); E.videos.push(n); drawEdit(k.name); },
  vrm: id => { const n = keepEdit(); E.videos.splice(+id, 1); drawEdit(n.name); },
  vup: id => { const n = keepEdit(), i = +id; if (i > 0) [E.videos[i - 1], E.videos[i]] = [E.videos[i], E.videos[i - 1]]; drawEdit(n.name); },
  vdn: id => { const n = keepEdit(), i = +id; if (i < E.videos.length - 1) [E.videos[i + 1], E.videos[i]] = [E.videos[i], E.videos[i + 1]]; drawEdit(n.name); },
  vrefresh: guard(async () => { ST.videos = null; render(); await loadVideos(); lastHtml = ''; render(); }),
  import: () => importSheet(),
  doimport: guard(async () => { const url = $('#i-url').value.trim(); if (!url) throw new Error('Link डालो'); await post('/api/import', { url, name: $('#i-name').value, convert: $('#i-conv').value, orient: $('#i-or').value, quality: $('#i-q').value, fit: $('#i-fit').value }); closeSheet(); toast('Import शुरू। Runner चालू होने में 30-60 सेकंड लगते हैं'); await refresh(); }),
  dismiss: guard(async id => { await del('/api/imports?id=' + id); await refresh(); }),
  rmvid: guard(async (id, e) => { const n = e.target.dataset.n, used = +e.target.dataset.u; if (await ask('File हटाएं?', used ? `“${n}” ${used} live में लगी है। हटाने पर वहाँ से भी निकल जाएगी।` : `“${n}” Release से हमेशा के लिए हट जाएगी।`, 'हटाओ', true)) { await del(`/api/videos?id=${id}&name=${encodeURIComponent(n)}${used ? '&force=1' : ''}`); ST.videos = null; await refresh(); } }),
  cnew: guard(() => clipSheet()),
  cstart: guard(async () => {
    const v = id => $('#' + id).value, url = v('c-url').trim(); if (!url) throw new Error('YouTube link डालो');
    await post('/api/clipstart', { url, account: v('c-acc'), clips: v('c-clips'), perDay: v('c-pd'), minSec: v('c-min'), maxSec: v('c-max'), orient: v('c-or'), captions: v('c-cap') === '1', budget: v('c-bud'), whisper: v('c-wh'), tz: v('c-tz'), startDate: v('c-sd'), lang: v('c-lang'), maxVideoMin: v('c-mm') });
    closeSheet(); toast('Job शुरू। Runner चालू होने में 30-60 सेकंड लगते हैं'); ST.clips = null; await refresh();
  }),
  cstop: guard(async id => { await post('/api/clipstop', { id }); toast('बंद करने का signal भेजा'); ST.clips = null; await refresh(); }),
  cresume: guard(async id => { await post('/api/clipresume', { id }); toast('दोबारा शुरू किया'); ST.clips = null; await refresh(); }),
  creset: guard(async id => { if (await ask('जॉब रीसेट करें?', 'Runner job cancel होगा। जो clips schedule हो चुके हैं वे YouTube पर रहेंगे।', 'रीसेट करो', true)) { await post('/api/clipreset', { id }); ST.clips = null; await refresh(); } }),
  crm: guard(async id => { if (await ask('जॉब हटाएं?', 'यह सिर्फ़ dashboard का record हटाएगा। YouTube पर schedule हो चुके videos नहीं हटेंगे। Release में बचे clips हों तो वे भी हट जाएँगे।', 'Delete करो', true)) { await del('/api/clipjobs?id=' + id); ST.clips = null; await refresh(); } }),
  clogs: id => logsSheet(id, 'clip'),
  kadd: () => keySheet(),
  ksave: guard(async () => { const r = await post('/api/gkeys', { keys: $('#k-keys').value }); closeSheet(); const m = [r.added ? r.added + ' key जुड़ी' : '', r.dup ? r.dup + ' पहले से थी' : '', r.bad.length ? 'ग़लत: ' + r.bad.join(', ') : ''].filter(Boolean).join(' · '); toast(m || 'कुछ नहीं जुड़ा', !r.added && r.bad.length > 0); ST.clips = null; await refresh(); }),
  krm: guard(async (id, e) => { if (await ask('Key हटाएं?', `“${e.target.dataset.n}” हट जाएगी।`, 'हटाओ', true)) { await del('/api/gkeys?id=' + id); ST.clips = null; await refresh(); } }),
  kreset: guard(async () => { await post('/api/gkeyreset', {}); toast('सब keys दोबारा चालू'); ST.clips = null; await refresh(); }),
  ckadd: () => cookieSheet(),
  cksave: guard(async () => { await post('/api/ytcookies', { text: $('#ck-t').value }); closeSheet(); toast('Cookies सेव हो गईं'); ST.clips = null; await refresh(); }),
  ckrm: guard(async () => { await del('/api/ytcookies'); toast('Cookies हट गईं'); ST.clips = null; await refresh(); }),
  connect: guard(async () => { const r = await api('/api/google/url'); location.href = r.url; }),
  rmacc: guard(async id => { if (await ask('चैनल हटाएं?', 'इस चैनल का login हट जाएगा। जिन lives में यह लगा है वहाँ पहले दूसरा चैनल चुनो।', 'हटाओ', true)) { await del('/api/accounts?id=' + id); await refresh(); } })
};
document.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (!t) return; if (t.tagName === 'A') e.preventDefault(); const f = A[t.dataset.a]; if (f) f(t.dataset.id || t.dataset.n, e); });
document.addEventListener('input', e => { if (e.target.dataset.h) ST.hours[e.target.dataset.h] = e.target.value; });
boot();
</script>
</body>
</html>
